[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-hancom-loader"
version = "0.1.0"
description = "LangChain document loader backed by the Hancom Data Loader API."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["hancom", "hwp", "hwpx", "langchain", "document-loader"]
dependencies = [
  "httpx>=0.27,<1.0",
  "langchain-core>=0.3,<2.0",
  "Markdown>=3.7,<4.0",
]
authors = [
  { name = "LangChain Hancom Loader contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/sungreong/langchain-hancom-loader"

[project.scripts]
hancom-webhook-receiver = "langchain_hancom_loader.webhook:main"
hancom-webhook-url = "langchain_hancom_loader.webhook_url:main"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_hancom_loader"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/langchain_hancom_loader",
  "deploy",
  "tests",
  "Dockerfile.webhook",
  "Dockerfile.tunnel",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "pyproject.toml",
]
